
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Symbi-Utsav 2026 Scanner</title>

<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: Arial, sans-serif;
  background: #eef2f7;
  color: #172554;
}

body {
  height: 100vh;
  height: 100dvh;
  padding: 6px;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.header {
  flex: 0 0 auto;
  text-align: center;
  background: #172554;
  color: white;
  padding: 7px;
  border-radius: 9px;
}

.header h1 {
  font-size: 18px;
  margin: 0 0 3px;
}

.header h3 {
  font-size: 11px;
  margin: 0;
}

.container {
  flex: 1;
  min-height: 0;
  width: 100%;
  max-width: 700px;
  margin: auto;
  padding: 7px;
  background: white;
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  gap: 6px;
  overflow: hidden;
}

.control-row {
  display: flex;
  align-items: end;
  gap: 7px;
}

.counter-box {
  flex: 1;
  min-width: 0;
}

label {
  display: block;
  font-size: 11px;
  font-weight: bold;
  margin-bottom: 4px;
}

select {
  width: 100%;
  height: 38px;
  padding: 5px 9px;
  border: 1px solid #cbd5e1;
  border-radius: 7px;
  background: white;
  font-size: 14px;
}

.buttons {
  display: flex;
  gap: 7px;
}

button {
  flex: 1;
  height: 39px;
  border: 0;
  border-radius: 7px;
  background: #1d4ed8;
  color: white;
  font-size: 12px;
  font-weight: bold;
}

button:disabled {
  opacity: .55;
}

.stop {
  background: #64748b;
}

#reader {
  width: 100%;
  height: clamp(100px, 19dvh, 155px);
  flex: 0 0 auto;
  overflow: hidden;
  border-radius: 8px;
  background: #111827;
}

#reader video {
  width: 100% !important;
  height: 100% !important;
  object-fit: contain !important;
}

#reader__dashboard,
#reader__header_message {
  display: none !important;
}

#result {
  flex: 1;
  min-height: 65px;
  overflow: auto;
  padding: 8px;
  margin: 0;
  border-radius: 8px;
  text-align: center;
  background: #f1f5f9;
  color: #334155;
  overflow-wrap: anywhere;
}

#result h2 {
  font-size: 17px;
  margin: 3px 0;
}

#result p {
  display: inline-block;
  font-size: 11px;
  margin: 3px 5px;
}

.status {
  font-size: 20px;
  font-weight: bold;
}

.approved {
  background: #dcfce7 !important;
  color: #166534 !important;
}

.rejected {
  background: #fee2e2 !important;
  color: #991b1b !important;
}

.duplicate {
  background: #fef3c7 !important;
  color: #92400e !important;
}

.loading {
  background: #dbeafe !important;
  color: #1e40af !important;
}

#status {
  flex: 0 0 auto;
  text-align: center;
  font-size: 10px;
  color: #64748b;
  margin: 0;
  padding: 2px;
}

@media (orientation: landscape) {
  body {
    padding: 4px;
    gap: 4px;
  }

  .header {
    padding: 4px;
  }

  .header h1 { font-size: 15px; }
  .header h3 { font-size: 10px; }

  .container {
    max-width: 950px;
    display: grid;
    grid-template-columns: 1fr 1.4fr;
    grid-template-rows: auto auto 1fr auto;
    gap: 5px;
    padding: 6px;
  }

  .control-row {
    grid-column: 1;
    grid-row: 1;
  }

  .buttons {
    grid-column: 1;
    grid-row: 2;
  }

  #reader {
    grid-column: 2;
    grid-row: 1 / 4;
    width: 100%;
    height: 100%;
    min-height: 100px;
    max-height: 230px;
  }

  #result {
    grid-column: 1 / 3;
    grid-row: 3;
    min-height: 50px;
  }

  #status {
    grid-column: 1 / 3;
    grid-row: 4;
  }
}
</style>
</head>

<body>

<div class="header">
  <h1>SYMBI-UTSAV 2026</h1>
  <h3>STUDENT ENTRY SCANNER</h3>
</div>

<div class="container">

  <div class="control-row">
    <div class="counter-box">
      <label for="counter">SELECT ENTRY COUNTER</label>
      <select id="counter">
        <option value="Counter 1">Counter 1</option>
        <option value="Counter 2">Counter 2</option>
        <option value="Counter 3">Counter 3</option>
        <option value="Counter 4">Counter 4</option>
        <option value="Counter 5">Counter 5</option>
      </select>
    </div>
  </div>

  <div class="buttons">
    <button id="startBtn" onclick="startScanner()">
      START SCANNER
    </button>

    <button class="stop" id="stopBtn" onclick="stopScanner()">
      STOP SCANNER
    </button>
  </div>

  <div id="reader"></div>

  <div id="result">
    <div class="status">READY TO SCAN</div>
    <p>Scan student barcode for entry verification.</p>
  </div>

  <p id="status">SCANNER NOT STARTED</p>

</div>

<script>

// ======================================
// CONFIGURATION
// ======================================

const API_URL = "https://script.google.com/macros/s/AKfycbzr7mC-Pan5SlWPjaooOlfrhJTjUjAmsonDlzXQnnoYLMy3u4PYHF7U1nsK--Gw7lbbfA/exec";

// Replace with your new random secret.
// Must match the Apps Script CONFIG.API_KEY.
const API_KEY = "REPLACE_WITH_YOUR_NEW_RANDOM_SECRET";

// ======================================

let scanner = null;
let running = false;
let busy = false;
let requestNumber = 0;
let scanTimer = null;

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, c => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[c]);
}

function showResult(status, message, details = {}) {

  const result = document.getElementById("result");

  let css = "rejected";

  if (status === "APPROVED") css = "approved";
  if (status === "DUPLICATE") css = "duplicate";
  if (status === "VERIFYING") css = "loading";

  result.className = css;

  result.innerHTML = `
    <div class="status">${escapeHTML(status)}</div>
    <h2>${escapeHTML(details.name || "")}</h2>
    <p>${escapeHTML(message)}</p>
    <p>Barcode: ${escapeHTML(details.barcode || "")}</p>
    <p>Counter: ${escapeHTML(details.counter || "")}</p>
    <p>Date: ${escapeHTML(details.date || "")}</p>
    <p>Time: ${escapeHTML(details.time || "")}</p>
  `;
}

async function startScanner() {

  if (running) return;

  if (!API_URL.startsWith("https://script.google.com/")) {
    alert("Configure Google Apps Script URL.");
    return;
  }

  document.getElementById("startBtn").disabled = true;

  scanner = new Html5Qrcode("reader", {
    formatsToSupport: [
      Html5QrcodeSupportedFormats.CODE_128
    ],
    verbose: false
  });

  try {

    const width = Math.max(
      180,
      Math.floor(document.getElementById("reader").clientWidth * 0.90)
    );

    await scanner.start(
      { facingMode: "environment" },
      {
        fps: 15,
        qrbox: {
          width: width,
          height: 100
        },
        disableFlip: false
      },
      onScanSuccess
    );

    running = true;

    document.getElementById("status").innerText =
      "CAMERA ACTIVE - READY TO SCAN";

  } catch (error) {

    document.getElementById("startBtn").disabled = false;

    document.getElementById("status").innerText =
      "CAMERA ERROR";

    alert("Camera error: " + error);

  }
}

function onScanSuccess(decodedText) {

  if (busy || !running) return;

  const barcode = decodedText.trim().toUpperCase();

  if (!barcode) return;

  busy = true;
  scanner.pause(true);

  showResult(
    "VERIFYING",
    "Checking student registration...",
    { barcode: barcode }
  );

  document.getElementById("status").innerText =
    "VERIFYING BARCODE...";

  verifyBarcode(barcode);
}

function verifyBarcode(barcode) {

  const callbackName =
    "cb_" + Date.now() + "_" + (++requestNumber);

  const script = document.createElement("script");

  let finished = false;

  function finish(data) {

    if (finished) return;
    finished = true;

    clearTimeout(scanTimer);

    delete window[callbackName];
    script.remove();

    showResult(
      data.status || "ERROR",
      data.message || "Verification failed",
      data
    );

    document.getElementById("status").innerText =
      data.status === "APPROVED"
        ? "ENTRY APPROVED"
        : "RESULT: " + (data.status || "ERROR");

    setTimeout(() => {

      busy = false;

      if (running && scanner) {
        scanner.resume();
        document.getElementById("status").innerText =
          "READY FOR NEXT STUDENT";
      }

    }, 1200);
  }

  window[callbackName] = finish;

  scanTimer = setTimeout(() => {
    finish({
      status: "ERROR",
      message: "Server timeout. Please try again.",
      barcode: barcode
    });
  }, 20000);

  const params = new URLSearchParams({
    action: "verify",
    barcode: barcode,
    counter: document.getElementById("counter").value,
    key: API_KEY,
    callback: callbackName
  });

  script.src = API_URL + "?" + params.toString();

  script.onerror = () => {
    finish({
      status: "ERROR",
      message: "Google Sheets connection failed",
      barcode: barcode
    });
  };

  document.body.appendChild(script);
}

async function stopScanner() {

  clearTimeout(scanTimer);

  if (!scanner) return;

  try {

    if (running) {
      await scanner.stop();
    }

    running = false;
    busy = false;

    document.getElementById("startBtn").disabled = false;

    document.getElementById("status").innerText =
      "SCANNER STOPPED";

  } catch (error) {

    document.getElementById("status").innerText =
      "STOP ERROR: " + error;

  }
}

</script>

</body>
</html>
